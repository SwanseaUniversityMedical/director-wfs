apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:  
    - CreateNamespace=true 
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    retry:
      refresh: true
      limit: 50
      backoff: 
        duration: "60s"
        factor: 1
        maxDuration: "30m0s"
  source:
    repoURL: "https://argoproj.github.io/argo-helm"
    chart: argo-cd
    targetRevision: "9.4.2"
    helm:
      valuesObject: 
        global:
          domain: "argocd.localtest.me"

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true

        configs:
          cm:
            create: true
            url: "http://argocd.localtest.me"

            kustomize.buildOptions: |
              --enable-helm

            resource.customizations: |
              argoproj.io/Application:
                health.lua: |
                  hs = {}
                  hs.status = "Progressing"
                  hs.message = ""
                  if obj.status ~= nil then
                    if obj.status.health ~= nil then
                      hs.status = obj.status.health.status
                      if obj.status.health.message ~= nil then
                        hs.message = obj.status.health.message
                      end
                    end
                  end
                  return hs

          params:
            application.namespaces: '*'
            server.insecure: true
            controller.status.processors: 100
            controller.operation.processors: 50

          secret:
            argocdServerAdminPassword: "$2a$10$335CAiV08.lMIbC093WhSel3X8wKJlVRpL/EYIHnb8ShUR9YeIj06"

        server:
          ingress:
            enabled: true
            ingressClassName: "nginx"
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            hostname: "argocd.localtest.me"
            tls: true

          certificate:
            enabled: true
            domain: "argocd.localtest.me"
            issuer:
              group: "cert-manager.io"
              kind: ClusterIssuer
              name: "ca-issuer"

          metrics:
            enabled: true
            serviceMonitor:
              enabled: true

        controller:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            rules:
              enabled: false

        repoServer:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true


        applicationSet:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true 

        notifications:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true 
