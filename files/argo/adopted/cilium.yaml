apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:  
    - CreateNamespace=true 
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    retry:
      refresh: true
      limit: 50
      backoff: 
        duration: "60s"
        factor: 1
        maxDuration: "30m0s"
  source:
    repoURL: "quay.io/cilium/charts"
    chart: cilium
    targetRevision: "1.19.0"
    helm:
      valuesObject: 
        operator:
          replicas: 1
          prometheus:
            serviceMonitor:
              enabled: true
          dashboards:
            enabled: true
            namespace: monitoring

        ipam:
          mode: kubernetes

        image:
          pullPolicy: IfNotPresent 

        hubble:
          enabled: true
          metrics:
            enabled: 
              - dns
              - drop
              - tcp
              - flow
              - port-distribution
              - icmp
              - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
            serviceMonitor:
              enabled: true
            dashboards:
              enabled: true
              namespace: monitoring
          relay:
            enabled: true
            prometheus:
              enabled: true
              serviceMonitor:
                enabled: true
          ui:
            enabled: true
            ingress:
              enabled: true
              className: nginx
              hosts:
                - hubble.localtest.me
          peerService:
            servicePort: 8443
          redact:
            enabled: true
            http:
              urlQuery: true
              userInfo: true
              headers:
                deny:
                  - Authorization
                  - Proxy-Authorization


        kubeProxyReplacement: true
        k8sServiceHost: director-wfs-control-plane 
        k8sServicePort: 6443 

        hostServices:
          enabled: false

        externalIPs:
          enabled: true

        nodePort: 
          enabled: true

        hostPort:
          enabled: true

        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true

        dashboards:
          enabled: true
          namespace: monitoring

        envoy:
          prometheus:
            serviceMonitor:
              enabled: true

